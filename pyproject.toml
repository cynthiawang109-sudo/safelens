[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "safelens"
version = "0.1.0"
description = "Retrieval and grounded answers over NASA ASRS reporter accounts."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "psycopg[binary]>=3.2",
    "python-dotenv>=1",
    "sentence-transformers>=3,<6",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.28",
    "openai>=1.60",
    "gradio>=5,<7",
    "rank-bm25==0.2.2",
    "scikit-learn>=1.5",
    "psutil>=6",
    "langgraph>=1,<2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "rank-bm25==0.2.2",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/safelens"]

[tool.ruff]
target-version = "py312"
