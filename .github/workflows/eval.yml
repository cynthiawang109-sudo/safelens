name: Development evaluation gate
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: development-eval-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  DATABASE_URL: postgresql://safelens:safelens@127.0.0.1:5432/safelens
  LEXICAL_BACKEND: bm25
  RETRIEVAL_MODE: hybrid
  RRF_DENSE_WEIGHT: '10'
  RRF_LEXICAL_WEIGHT: '1'
  AGENT_ENABLED: 'true'
  AGENT_MAX_RETRIES: '2'
  AGENT_MAX_CALLS: '6'
  RERANK_ENABLED: 'false'
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: safelens
          POSTGRES_PASSWORD: safelens
          POSTGRES_DB: safelens
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U safelens -d safelens"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Initialize failure artifact and runner space
        run: |
          mkdir -p data
          printf '{"passed":false,"message":"Setup did not reach development evaluation"}\n' > data/ci-eval.json
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.10.11'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run --no-sync python scripts/check_protected.py
      - name: Download and verify all three pinned source files
        run: uv run --no-sync python scripts/download_dataset.py
      - run: uv run --no-sync python -m safelens.migrate
      - name: Fresh full 20k production ingest and offline reindex
        run: uv run --no-sync python -m safelens.cli reindex --corpus-manifest eval/corpus_manifest_20k.json
      - name: Start frozen API only when the repository secret exists
        if: env.OPENAI_API_KEY != ''
        run: |
          uv run --no-sync uvicorn safelens.app:app --host 127.0.0.1 --port 8000 > data/api.log 2>&1 &
          uv run --no-sync python scripts/wait_api.py http://127.0.0.1:8000
      - name: Development metrics, SQL and Ask gate (missing secret fails explicitly)
        run: uv run --no-sync python eval/run_ci_gate.py --output data/ci-eval.json
      - name: Recheck protected assets
        if: always()
        run: uv run --no-sync python scripts/check_protected.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: development-evaluation-${{ github.run_id }}
          path: data/ci-eval.json
          if-no-files-found: error
