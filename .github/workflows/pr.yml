name: PR gate
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true
env:
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  DATABASE_URL: postgresql://safelens:safelens@127.0.0.1:5432/safelens
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  SAFELENS_HERMETIC: '1'
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: safelens
          POSTGRES_PASSWORD: safelens
          POSTGRES_DB: safelens
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U safelens -d safelens"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Make room for locked Linux ML wheels
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.10.11'
          python-version: '3.12'
          enable-cache: false
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync python scripts/check_protected.py
      - name: Hermetic Python suite (synthetic DB; no model or LLM calls)
        run: uv run --no-sync pytest -m "not live_corpus and not live_api and not model_download"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx tsc --noEmit
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web
