services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: safelens
      POSTGRES_PASSWORD: safelens
      POSTGRES_DB: safelens
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safelens -d safelens"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  db_data:
