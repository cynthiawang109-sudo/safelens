services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: safelens
      POSTGRES_PASSWORD: safelens
      POSTGRES_DB: safelens
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safelens -d safelens"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: web/docker/api.Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://safelens:safelens@db:5432/safelens
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    volumes:
      - ./data/models:/app/data/models
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=10)"]
      interval: 15s
      timeout: 12s
      retries: 12
      start_period: 120s
  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://api:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_data:
